name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_VERSION: "1.98.0"
  NODE_VERSION: "22.22.3"
  PNPM_VERSION: "11.24.0"

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-musl
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl

          - name: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc

          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin

          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: lingting-ai-gateway-ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: lingting-ai-gateway-ui
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: release-${{ matrix.name }}

      - name: Prepare release environment
        shell: bash
        run: bash .release/ci_prerelease.sh

      - name: Build
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
          BUILD_OUTPUT_DIR: dist/bin
        run: bash scripts/build_current.sh

      - name: Package
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.name }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash .release/ci_package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      - name: Prepare release
        shell: bash
        run: bash .release/ci_release.sh

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/release/*
