name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RUST_VERSION: "1.98.0"
  NODE_VERSION: "22.22.3"
  PNPM_VERSION: "11.24.0"
  RELEASE_PUBKEY_FINGERPRINT: "SHA256:+7HthGNGniZd5oo+s4+eDB7PzTATkKgofDRuWRtbgS4"
  LINGTING_GATEWAY_CI: "1"

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gateway
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup release environment
        uses: ./.github/actions/setup-release
        with:
          rust-version: ${{ env.RUST_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Verify release
        run: bash .release/ci_verify.sh

  build-linux:
    name: Build Linux
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gateway
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup release environment
        uses: ./.github/actions/setup-release
        with:
          rust-version: ${{ env.RUST_VERSION }}
          rust-targets: x86_64-unknown-linux-musl,x86_64-unknown-linux-gnu
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build Linux
        run: bash .release/ci_build.sh -l

      - name: Build Linux slim
        run: bash .release/ci_build.sh -l -s

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/lingting-ai-gateway-linux
            dist/lingting-ai-gateway-linux-slim
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: verify
    runs-on: windows-latest

    steps:
      - name: Checkout gateway
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup release environment
        uses: ./.github/actions/setup-release
        with:
          rust-version: ${{ env.RUST_VERSION }}
          rust-targets: x86_64-pc-windows-msvc
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Build Windows
        shell: bash
        run: bash .release/ci_build.sh -w

      - name: Build Windows slim
        shell: bash
        run: bash .release/ci_build.sh -w -s

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/lingting-ai-gateway-windows.exe
            dist/lingting-ai-gateway-windows-slim.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS
    needs: verify
    runs-on: macos-latest

    steps:
      - name: Checkout gateway
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup release environment
        uses: ./.github/actions/setup-release
        with:
          rust-version: ${{ env.RUST_VERSION }}
          rust-targets: x86_64-apple-darwin
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Build macOS
        run: bash .release/ci_build.sh -m

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/lingting-ai-gateway-macos
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - verify
      - build-linux
      - build-windows
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gateway
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Linux artifacts
        uses: actions/download-artifact@v5
        with:
          name: linux-artifacts
          path: dist

      - name: Download Windows artifacts
        uses: actions/download-artifact@v5
        with:
          name: windows-artifacts
          path: dist

      - name: Download macOS artifact
        uses: actions/download-artifact@v5
        with:
          name: macos-artifacts
          path: dist

      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/lingting-ai-gateway-linux
          test -f dist/lingting-ai-gateway-linux-slim
          test -f dist/lingting-ai-gateway-windows.exe
          test -f dist/lingting-ai-gateway-windows-slim.exe
          test -f dist/lingting-ai-gateway-macos

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/lingting-ai-gateway-linux \
            dist/lingting-ai-gateway-linux-slim \
            dist/lingting-ai-gateway-windows.exe \
            dist/lingting-ai-gateway-windows-slim.exe \
            dist/lingting-ai-gateway-macos \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes