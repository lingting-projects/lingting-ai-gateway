name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RUST_VERSION: "1.98.0"
  RELEASE_PUBKEY_FINGERPRINT: "SHA256:+7HthGNGniZd5oo+s4+eDB7PzTATkKgofDRuWRtbgS4"

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gateway
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify release
        run: bash .release/ci_verify.sh

  linux:
    name: Build Linux
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gateway
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-musl,x86_64-unknown-linux-gnu

      - name: Verify release
        run: bash .release/ci_verify.sh

      - name: Build Linux static
        run: bash .release/ci_build.sh -l

      - name: Build Linux slim
        run: bash .release/ci_build.sh -sl

      - name: Verify artifacts
        run: bash .release/ci_release.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/lingting-ai-gateway-linux
            dist/lingting-ai-gateway-linux-slim
          if-no-files-found: error

  windows:
    name: Build Windows
    needs: verify
    runs-on: windows-latest

    steps:
      - name: Checkout gateway
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Verify release
        shell: bash
        run: bash .release/ci_verify.sh

      - name: Build Windows static
        shell: bash
        run: bash .release/ci_build.sh -w

      - name: Build Windows slim
        shell: bash
        run: bash .release/ci_build.sh -sw

      - name: Verify artifacts
        shell: bash
        run: bash .release/ci_release.sh

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/lingting-ai-gateway-windows.exe
            dist/lingting-ai-gateway-windows-slim.exe
          if-no-files-found: error

  macos:
    name: Build macOS
    needs: verify
    runs-on: macos-latest

    steps:
      - name: Checkout gateway
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-apple-darwin

      - name: Verify release
        run: bash .release/ci_verify.sh

      - name: Build macOS
        run: bash .release/ci_build.sh -m

      - name: Build macOS slim
        run: bash .release/ci_build.sh -sm

      - name: Verify artifacts
        run: bash .release/ci_release.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/lingting-ai-gateway-macos
            dist/lingting-ai-gateway-macos-slim
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs:
      - linux
      - windows
      - macos

    runs-on: ubuntu-latest

    steps:
      - name: Checkout gateway
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.ref_name }}
          fetch-depth: 0

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist

      - name: Prepare release
        run: bash .release/ci_release.sh

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/lingting-ai-gateway-linux
            dist/lingting-ai-gateway-linux-slim
            dist/lingting-ai-gateway-windows.exe
            dist/lingting-ai-gateway-windows-slim.exe
            dist/lingting-ai-gateway-macos
            dist/lingting-ai-gateway-macos-slim
            dist/SHA256SUMS
