name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_PUBKEY_FINGERPRINT: "SHA256:+7HthGNGniZd5oo+s4+eDB7PzTATkKgofDRuWRtbgS4"
  EXPECTED_FRAMEWORK_REPOSITORY: "https://github.com/lingting-projects/lingting-rust-framework.git"

jobs:
  verify:
    name: Verify release metadata
    runs-on: ubuntu-latest

    outputs:
      framework_commit: ${{ steps.metadata.outputs.framework_commit }}
      framework_branch: ${{ steps.metadata.outputs.framework_branch }}

    steps:
      - name: Checkout gateway tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify public key fingerprint
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL="$(
            ssh-keygen -lf .release/pubkey -E sha256 |
              awk '{print $2}'
          )"

          echo "Expected fingerprint:"
          echo "  ${RELEASE_PUBKEY_FINGERPRINT}"

          echo "Actual fingerprint:"
          echo "  ${ACTUAL}"

          if [[ "$ACTUAL" != "$RELEASE_PUBKEY_FINGERPRINT" ]]; then
            echo "error: release public key fingerprint mismatch"
            exit 1
          fi

      - name: Verify release signature
        shell: bash
        run: |
          set -euo pipefail

          chmod +x .release/sign.sh

          .release/sign.sh verify

      - name: Validate release metadata
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          get_value() {
            local key="$1"

            sed -n "s/^${key}=//p" .release/info |
              head -n 1
          }

          VERSION="$(get_value version)"
          TAG="$(get_value tag)"
          REPOSITORY="$(get_value repository)"
          BRANCH="$(get_value branch)"
          COMMIT="$(get_value commit)"
          TIMESTAMP="$(get_value timestamp)"
          TIMESTAMP_UNIX="$(get_value timestamp_unix)"

          echo "version=$VERSION"
          echo "tag=$TAG"
          echo "repository=$REPOSITORY"
          echo "branch=$BRANCH"
          echo "commit=$COMMIT"
          echo "timestamp=$TIMESTAMP"
          echo "timestamp_unix=$TIMESTAMP_UNIX"

          if [[ "$VERSION" != "1" ]]; then
            echo "error: unsupported metadata version"
            exit 1
          fi

          if [[ "$TAG" != "$RELEASE_TAG" ]]; then
            echo "error: metadata tag does not match GitHub tag"
            exit 1
          fi

          if [[ "$REPOSITORY" != "$EXPECTED_FRAMEWORK_REPOSITORY" ]]; then
            echo "error: unexpected framework repository"
            exit 1
          fi

          if [[ -z "$BRANCH" ]]; then
            echo "error: framework branch is empty"
            exit 1
          fi

          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "error: invalid framework commit"
            exit 1
          fi

          if [[ -z "$TIMESTAMP" ]]; then
            echo "error: timestamp is empty"
            exit 1
          fi

          if [[ ! "$TIMESTAMP_UNIX" =~ ^[0-9]+$ ]]; then
            echo "error: invalid timestamp_unix"
            exit 1
          fi

          {
            echo "framework_commit=$COMMIT"
            echo "framework_branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"

      - name: Verify framework commit exists
        shell: bash
        env:
          FRAMEWORK_REPOSITORY: ${{ env.EXPECTED_FRAMEWORK_REPOSITORY }}
          FRAMEWORK_COMMIT: ${{ steps.metadata.outputs.framework_commit }}
        run: |
          set -euo pipefail

          REMOTE_COMMIT="$(
            git ls-remote "$FRAMEWORK_REPOSITORY" "$FRAMEWORK_COMMIT" |
              awk 'NR == 1 { print $1 }'
          )"

          if [[ "$REMOTE_COMMIT" != "$FRAMEWORK_COMMIT" ]]; then
            echo "error: framework commit does not exist on remote"
            echo "expected: $FRAMEWORK_COMMIT"
            echo "actual:   ${REMOTE_COMMIT:-<none>}"
            exit 1
          fi

          echo "framework commit confirmed:"
          echo "$FRAMEWORK_COMMIT"

  build-linux:
    name: Build Linux
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gateway tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.ref_name }}
          fetch-depth: 0

      - name: Checkout framework
        uses: actions/checkout@v7
        with:
          repository: lingting-projects/lingting-rust-framework
          ref: ${{ needs.verify.outputs.framework_commit }}
          path: lingting-rust-framework
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build static Linux binary
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          cargo build \
            --release \
            --bin bin-server \
            --target x86_64-unknown-linux-musl

          cp \
            target/x86_64-unknown-linux-musl/release/bin-server \
            lingting-ai-gateway-linux

      - name: Build dynamic Linux binary
        env:
          RUSTFLAGS: "-C target-feature=-crt-static"
        run: |
          cargo build \
            --release \
            --bin bin-server \
            --target x86_64-unknown-linux-gnu

          cp \
            target/x86_64-unknown-linux-gnu/release/bin-server \
            lingting-ai-gateway-linux-slim

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            lingting-ai-gateway-linux
            lingting-ai-gateway-linux-slim

  build-windows:
    name: Build Windows
    needs: verify
    runs-on: windows-latest

    steps:
      - name: Checkout gateway tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.ref_name }}
          fetch-depth: 0

      - name: Checkout framework
        uses: actions/checkout@v7
        with:
          repository: lingting-projects/lingting-rust-framework
          ref: ${{ needs.verify.outputs.framework_commit }}
          path: lingting-rust-framework
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Build static Windows binary
        shell: bash
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          cargo build \
            --release \
            --bin bin-server \
            --target x86_64-pc-windows-msvc

          cp \
            target/x86_64-pc-windows-msvc/release/bin-server.exe \
            lingting-ai-gateway-windows.exe

      - name: Build dynamic Windows binary
        shell: bash
        env:
          RUSTFLAGS: "-C target-feature=-crt-static"
        run: |
          cargo build \
            --release \
            --bin bin-server \
            --target x86_64-pc-windows-msvc

          cp \
            target/x86_64-pc-windows-msvc/release/bin-server.exe \
            lingting-ai-gateway-windows-slim.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            lingting-ai-gateway-windows.exe
            lingting-ai-gateway-windows-slim.exe

  build-macos:
    name: Build macOS
    needs: verify
    runs-on: macos-latest

    steps:
      - name: Checkout gateway tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.ref_name }}
          fetch-depth: 0

      - name: Checkout framework
        uses: actions/checkout@v7
        with:
          repository: lingting-projects/lingting-rust-framework
          ref: ${{ needs.verify.outputs.framework_commit }}
          path: lingting-rust-framework
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build macOS binary
        run: |
          cargo build \
            --release \
            --bin bin-server

          cp \
            target/release/bin-server \
            lingting-ai-gateway-macos

      - name: Build macOS slim binary
        run: |
          cargo build \
            --release \
            --bin bin-server

          cp \
            target/release/bin-server \
            lingting-ai-gateway-macos-slim

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            lingting-ai-gateway-macos
            lingting-ai-gateway-macos-slim

  release:
    name: Publish GitHub Release
    needs:
      - verify
      - build-linux
      - build-windows
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gateway tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.ref_name }}
          fetch-depth: 0

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux
          path: release

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows
          path: release

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos
          path: release

      - name: List release artifacts
        run: |
          set -euo pipefail

          find release -maxdepth 1 -type f -print

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/lingting-ai-gateway-linux
            release/lingting-ai-gateway-linux-slim
            release/lingting-ai-gateway-windows.exe
            release/lingting-ai-gateway-windows-slim.exe
            release/lingting-ai-gateway-macos
            release/lingting-ai-gateway-macos-slim