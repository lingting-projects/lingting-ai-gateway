name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RUST_VERSION: "1.98.0"
  NODE_VERSION: "22.22.3"
  PNPM_VERSION: "11.24.0"
  RELEASE_PUBKEY_FINGERPRINT: "SHA256:+7HthGNGniZd5oo+s4+eDB7PzTATkKgofDRuWRtbgS4"

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - name: Configure Git line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout gateway
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify release metadata
        shell: bash
        run: bash .release/ci_verify.sh

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-musl,x86_64-unknown-linux-gnu

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: lingting-ai-gateway-ui/pnpm-lock.yaml

      - name: Verify release metadata
        shell: bash
        run: bash .release/ci_verify.sh

      - name: Build Linux static
        shell: bash
        run: bash .release/ci_build.sh -l

      - name: Build Linux slim
        shell: bash
        run: bash .release/ci_build.sh -sl

      - name: Prepare release artifacts
        shell: bash
        run: bash .release/ci_release.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/lingting-ai-gateway-linux
            dist/lingting-ai-gateway-linux-slim
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: verify

    steps:
      - name: Configure Git line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: lingting-ai-gateway-ui/pnpm-lock.yaml

      - name: Verify release metadata
        shell: bash
        run: bash .release/ci_verify.sh

      - name: Build Windows static
        shell: bash
        run: bash .release/ci_build.sh -w

      - name: Build Windows slim
        shell: bash
        run: bash .release/ci_build.sh -sw

      - name: Prepare release artifacts
        shell: bash
        run: bash .release/ci_release.sh

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/lingting-ai-gateway-windows.exe
            dist/lingting-ai-gateway-windows-slim.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-apple-darwin

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: lingting-ai-gateway-ui/pnpm-lock.yaml

      - name: Verify release metadata
        shell: bash
        run: bash .release/ci_verify.sh

      - name: Build macOS static
        shell: bash
        run: bash .release/ci_build.sh -m

      - name: Build macOS slim
        shell: bash
        run: bash .release/ci_build.sh -sm

      - name: Prepare release artifacts
        shell: bash
        run: bash .release/ci_release.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/lingting-ai-gateway-macos
            dist/lingting-ai-gateway-macos-slim
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
      - build-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-linux
          path: dist

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-windows
          path: dist

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-macos
          path: dist

      - name: Prepare release artifacts
        shell: bash
        run: bash .release/ci_release.sh

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/lingting-ai-gateway-linux
            dist/lingting-ai-gateway-linux-slim
            dist/lingting-ai-gateway-windows.exe
            dist/lingting-ai-gateway-windows-slim.exe
            dist/lingting-ai-gateway-macos
            dist/lingting-ai-gateway-macos-slim
