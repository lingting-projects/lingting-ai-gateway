name: Setup release environment
description: Install Rust, Node.js and pnpm, and restore the Rust build cache.

inputs:
  rust-version:
    description: Rust toolchain version.
    required: true

  rust-targets:
    description: Comma-separated Rust targets to install.
    required: false
    default: ""

  node-version:
    description: Node.js version.
    required: true

  pnpm-version:
    description: pnpm version.
    required: true

runs:
  using: composite

  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.rust-version }}
        targets: ${{ inputs.rust-targets }}

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: lingting-ai-gateway-ui/pnpm-lock.yaml

    - name: Cache Rust
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-rust-${{ inputs.rust-version }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-rust-${{ inputs.rust-version }}-