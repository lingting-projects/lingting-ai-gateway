name: Setup release environment
description: Install Rust, Node.js and pnpm, and restore the Rust and pnpm caches.

inputs:
  rust-version:
    description: Rust toolchain version.
    required: true

  rust-targets:
    description: Comma-separated Rust targets to install.
    required: false
    default: ""

  node-version:
    description: Node.js version.
    required: true

  pnpm-version:
    description: pnpm version.
    required: true

runs:
  using: composite

  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.rust-version }}
        targets: ${{ inputs.rust-targets }}

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Resolve pnpm store
      id: pnpm-store
      shell: bash
      run: |
        set -euo pipefail

        STORE_PATH="$(pnpm store path)"
        mkdir -p "$STORE_PATH"

        echo "path=$STORE_PATH" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm
      uses: actions/cache@v5
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-${{ inputs.pnpm-version }}-${{ hashFiles('lingting-ai-gateway-ui/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-${{ inputs.pnpm-version }}-

    - name: Cache Rust
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-rust-${{ inputs.rust-version }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-rust-${{ inputs.rust-version }}-